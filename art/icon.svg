    </radialGradient>
    <linearGradient id="scale" x1="30" y1="0" x2="78" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6E61"/>
      <stop offset="0.3" stop-color="#FFB84D"/>
      <stop offset="0.5" stop-color="#45E6A6"/>
      <stop offset="0.7" stop-color="#FFB84D"/>
      <stop offset="1" stop-color="#FF6E61"/>
