<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="18 18 72 72">
  <!-- Same geometry as app/src/main/res/drawable/ic_launcher_{background,foreground}.xml; the
       view box is the 72 dp part of the adaptive icon that launchers actually show. -->
